server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html dashboard.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse Proxy para WebSocket de Telemetría (plant_monitor_backend :8081)
    location /ws-plant {
        proxy_pass http://plant_monitor_backend:8081/ws-plant;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    # Reverse Proxy para WebSocket de Alertas (operator_console_backend :8082)
    location /ws-alerts {
        proxy_pass http://operator_console_backend:8082/ws-alerts;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    # Reverse Proxy hacia Action Dispatcher + PostgreSQL (:8080)
    location /api/dispatcher/ {
        proxy_pass http://action_dispatcher:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Reverse Proxy hacia Sensor Producer (:8089)
    location /api/producer/ {
        proxy_pass http://sensor_producer:8089/;
        proxy_set_header Host $host;
    }
}
