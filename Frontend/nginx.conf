server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html dashboard.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse Proxy hacia sensor_producer (:8089)
    location /api/simulation/ {
        proxy_pass http://sensor_producer:8089/api/v1/simulation/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Reverse Proxy hacia alert_detector (:8088)
    location /api/detector/ {
        proxy_pass http://alert_detector:8088/api/v1/detector/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Reverse Proxy hacia plant_monitor_backend (:8081)
    location /api/plant/ {
        proxy_pass http://plant_monitor_backend:8081/api/v1/sensors/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Reverse Proxy hacia operator_console_backend (:8082)
    location /api/alerts/ {
        proxy_pass http://operator_console_backend:8082/api/v1/alerts/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Reverse Proxy hacia action_dispatcher (:8080)
    location /api/dispatcher/ {
        proxy_pass http://action_dispatcher:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

    # Reverse Proxy hacia actuator_worker (:8085)
    location /api/actuators/ {
        proxy_pass http://actuator_worker:8085/api/v1/actuators/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Reverse Proxy hacia maintenance_worker (:8086)
    location /api/maintenance/ {
        proxy_pass http://maintenance_worker:8086/api/v1/maintenance/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # WebSocket Reverse Proxy hacia plant_monitor_backend (:8081)
    location /ws-plant {
        proxy_pass http://plant_monitor_backend:8081/ws-plant;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    # WebSocket Reverse Proxy hacia operator_console_backend (:8082)
    location /ws-alerts {
        proxy_pass http://operator_console_backend:8082/ws-alerts;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }
}
