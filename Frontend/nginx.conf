limit_req_zone $binary_remote_addr zone=general:10m rate=25r/s;
limit_req_zone $binary_remote_addr zone=decide_api:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=perip:10m;

server {
    listen 80;
    server_name scada-ucc-alejandro.77.113.90.86.sslip.io scada-ucc.77-113-90-86.nip.io _;

    server_tokens off;
    client_max_body_size 5m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 10s;

    # Cabeceras de Seguridad Defensiva (Guía Hardening Ubuntu Server)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    limit_conn perip 30;

    root /usr/share/nginx/html;
    index index.html dashboard.html;

    # Bloquear acceso a archivos ocultos o de respaldo (.git, .env, .sql, .bak)
    location ~ /\.(?!well-known) {
        deny all;
    }
    location ~* \.(bak|old|sql|swp|env|log)$ {
        deny all;
    }

    location / {
        limit_req zone=general burst=40 nodelay;
        try_files $uri $uri/ /index.html;
    }

    # Reverse Proxy hacia sensor_producer (:8089 en red interna)
    location /api/simulation/ {
        limit_req zone=general burst=20 nodelay;
        proxy_pass http://sensor_producer:8089/api/v1/simulation/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_hide_header X-Powered-By;
    }

    # Reverse Proxy hacia alert_detector (:8088 en red interna)
    location /api/detector/ {
        proxy_pass http://alert_detector:8088/api/v1/detector/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header X-Powered-By;
    }

    # Reverse Proxy hacia plant_monitor_backend (:8081 en red interna)
    location /api/plant/ {
        proxy_pass http://plant_monitor_backend:8081/api/v1/sensors/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header X-Powered-By;
    }

    # Reverse Proxy hacia operator_console_backend (:8082 en red interna)
    location /api/alerts/ {
        proxy_pass http://operator_console_backend:8082/api/v1/alerts/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header X-Powered-By;
    }

    # Reverse Proxy hacia action_dispatcher (:8080 en red interna)
    location /api/dispatcher/ {
        limit_req zone=general burst=25 nodelay;
        proxy_pass http://action_dispatcher:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_hide_header X-Powered-By;
    }

    # Reverse Proxy balanceado hacia las 2 réplicas de actuator_worker (:8085)
    location /api/actuators/ {
        proxy_pass http://actuator_worker:8085/api/v1/actuators/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header X-Powered-By;
    }

    # Reverse Proxy balanceado hacia las 2 réplicas de maintenance_worker (:8086)
    location /api/maintenance/ {
        proxy_pass http://maintenance_worker:8086/api/v1/maintenance/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header X-Powered-By;
    }

    # WebSocket Reverse Proxy hacia plant_monitor_backend (:8081)
    location /ws-plant {
        proxy_pass http://plant_monitor_backend:8081/ws-plant;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    # WebSocket Reverse Proxy hacia operator_console_backend (:8082)
    location /ws-alerts {
        proxy_pass http://operator_console_backend:8082/ws-alerts;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }
}
