limit_req_zone $binary_remote_addr zone=general:10m rate=25r/s;
limit_req_zone $binary_remote_addr zone=decide_api:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=perip:10m;

server {
    listen 80;
    listen 443 ssl;
    server_name scada-ucc-alejandro.77.113.90.86.sslip.io scada-ucc.77-113-90.86.nip.io _;

    ssl_certificate /etc/nginx/ssl/scada.crt;
    ssl_certificate_key /etc/nginx/ssl/scada.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    resolver 127.0.0.11 valid=10s ipv6=off;

    server_tokens off;
    client_max_body_size 5m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 10s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    limit_conn perip 30;

    root /usr/share/nginx/html;
    index index.html dashboard.html;

    location ~ /\.(?!well-known) {
        deny all;
    }
    location ~* \.(bak|old|sql|swp|env|log)$ {
        deny all;
    }

    location / {
        limit_req zone=general burst=40 nodelay;
        try_files $uri $uri/ /index.html;
    }

    location /api/simulation/ {
        limit_req zone=general burst=20 nodelay;
        set $upstream_producer http://sensor_producer:8089;
        rewrite ^/api/simulation/(.*)$ /api/v1/simulation/$1 break;
        proxy_pass $upstream_producer;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_hide_header X-Powered-By;
    }

    location /api/detector/ {
        set $upstream_detector http://alert_detector:8088;
        rewrite ^/api/detector/(.*)$ /api/v1/detector/$1 break;
        proxy_pass $upstream_detector;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header X-Powered-By;
    }

    location /api/plant/ {
        set $upstream_plant http://plant_monitor_backend:8081;
        rewrite ^/api/plant/(.*)$ /api/v1/sensors/$1 break;
        proxy_pass $upstream_plant;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header X-Powered-By;
    }

    location /api/alerts/ {
        set $upstream_alerts http://operator_console_backend:8082;
        rewrite ^/api/alerts/(.*)$ /api/v1/alerts/$1 break;
        proxy_pass $upstream_alerts;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header X-Powered-By;
    }

    location /api/dispatcher/ {
        limit_req zone=general burst=25 nodelay;
        set $upstream_dispatcher http://action_dispatcher:8080;
        rewrite ^/api/dispatcher/(.*)$ /$1 break;
        proxy_pass $upstream_dispatcher;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_hide_header X-Powered-By;
    }

    location /api/actuators/ {
        set $upstream_actuators http://actuator_worker:8085;
        rewrite ^/api/actuators/(.*)$ /api/v1/actuators/$1 break;
        proxy_pass $upstream_actuators;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header X-Powered-By;
    }

    location /api/maintenance/ {
        set $upstream_maintenance http://maintenance_worker:8086;
        rewrite ^/api/maintenance/(.*)$ /api/v1/maintenance/$1 break;
        proxy_pass $upstream_maintenance;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header X-Powered-By;
    }

    location /ws-plant {
        set $upstream_ws_plant http://plant_monitor_backend:8081;
        proxy_pass $upstream_ws_plant;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    location /ws-alerts {
        set $upstream_ws_alerts http://operator_console_backend:8082;
        proxy_pass $upstream_ws_alerts;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }
}
