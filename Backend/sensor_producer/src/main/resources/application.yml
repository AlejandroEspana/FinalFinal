server:
  port: ${SERVER_PORT:8089}

spring:
  application:
    name: sensor_producer
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

app:
  simulation:
    enabled: ${APP_SIMULATION_ENABLED:true}
    rate-ms: ${APP_SIMULATION_INTERVAL_MS:${SIMULATION_RATE_MS:12000}}
  security:
    operator-username: ${APP_OPERATOR_USER:operator}
    operator-password: ${APP_OPERATOR_PASS:operator123}
  kafka:
    topics:
      sensor-data: ${TOPIC_SENSOR_DATA:sensor_data}

logging:
  level:
    com.empresa.mantenimiento: INFO
