server:
  port: 8081

spring:
  application:
    name: plant_monitor_backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

app:
  kafka:
    topics:
      sensor-data: ${TOPIC_SENSOR_DATA:sensor_data}
      alerts-critical: ${TOPIC_ALERTS_CRITICAL:alerts_critical}
      alerts-warning: ${TOPIC_ALERTS_WARNING:alerts_warning}

logging:
  level:
    com.empresa.mantenimiento: INFO
