services:
  # ============================================================================
  # 1. INFRAESTRUCTURA DE DATOS Y MENSAJERÍA (Confinados en 127.0.0.1)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: iot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mantenimiento_db}
      POSTGRES_USER: ${POSTGRES_USER:-iot_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iot_secret_2026}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iot_admin -d mantenimiento_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    networks:
      - iot_industrial_net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: iot_zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "127.0.0.1:2181:2181"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    networks:
      - iot_industrial_net

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: iot_kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 768M
    networks:
      - iot_industrial_net

  rabbitmq:
    build:
      context: ./docker/rabbitmq
      dockerfile: Dockerfile
    container_name: iot_rabbitmq
    restart: unless-stopped
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-iot_rabbit}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-iot_rabbit_2026}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    networks:
      - iot_industrial_net

  # ============================================================================
  # 2. MICROSERVICIOS BACKEND (Confinados en 127.0.0.1 detrás de Nginx Reverse Proxy)
  # ============================================================================
  sensor_producer:
    build:
      context: ./Backend/sensor_producer
      dockerfile: Dockerfile
    container_name: iot_sensor_producer
    restart: on-failure
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:8089:8089"
    environment:
      SERVER_PORT: 8089
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      APP_SIMULATION_ENABLED: "true"
      APP_SIMULATION_INTERVAL_MS: 12000
      SIMULATION_RATE_MS: 12000
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M
    networks:
      - iot_industrial_net

  alert_detector:
    build:
      context: ./Backend/alert_detector
      dockerfile: Dockerfile
    container_name: iot_alert_detector
    restart: on-failure
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:8088:8088"
    environment:
      SERVER_PORT: 8088
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    networks:
      - iot_industrial_net

  alert_router:
    build:
      context: ./Backend/alert_router
      dockerfile: Dockerfile
    container_name: iot_alert_router
    restart: on-failure
    depends_on:
      kafka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "127.0.0.1:8087:8087"
    environment:
      SERVER_PORT: 8087
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-iot_rabbit}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-iot_rabbit_2026}
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-iot_rabbit}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASS:-iot_rabbit_2026}
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M
    networks:
      - iot_industrial_net

  plant_monitor_backend:
    build:
      context: ./Backend/plant_monitor_backend
      dockerfile: Dockerfile
    container_name: iot_plant_monitor_backend
    restart: on-failure
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      SERVER_PORT: 8081
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M
    networks:
      - iot_industrial_net

  operator_console_backend:
    build:
      context: ./Backend/operator_console_backend
      dockerfile: Dockerfile
    container_name: iot_operator_console_backend
    restart: on-failure
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      SERVER_PORT: 8082
      RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-iot_rabbit}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-iot_rabbit_2026}
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-iot_rabbit}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASS:-iot_rabbit_2026}
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M
    networks:
      - iot_industrial_net

  action_dispatcher:
    build:
      context: ./Backend/action_dispatcher
      dockerfile: Dockerfile
    container_name: iot_action_dispatcher
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-mantenimiento_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-iot_admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-iot_secret_2026}
      RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-iot_rabbit}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-iot_rabbit_2026}
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-iot_rabbit}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASS:-iot_rabbit_2026}
      APP_DELAYED_MILLIS: 10000
      APP_OPERATOR_USER: ${APP_OPERATOR_USER:-operator}
      APP_OPERATOR_PASS: ${APP_OPERATOR_PASS:-operator123}
      APP_ADMIN_USER: ${APP_ADMIN_USER:-admin}
      APP_ADMIN_PASS: ${APP_ADMIN_PASS:-admin123}
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    networks:
      - iot_industrial_net

  actuator_worker:
    build:
      context: ./Backend/actuator_worker
      dockerfile: Dockerfile
    restart: on-failure
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - "127.0.0.1:8091-8092:8085"
    environment:
      SERVER_PORT: 8085
      RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-iot_rabbit}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-iot_rabbit_2026}
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-iot_rabbit}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASS:-iot_rabbit_2026}
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.50"
          memory: 384M
    networks:
      - iot_industrial_net

  maintenance_worker:
    build:
      context: ./Backend/maintenance_worker
      dockerfile: Dockerfile
    restart: on-failure
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - "127.0.0.1:8093-8094:8086"
    environment:
      SERVER_PORT: 8086
      RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-iot_rabbit}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-iot_rabbit_2026}
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-iot_rabbit}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASS:-iot_rabbit_2026}
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.50"
          memory: 384M
    networks:
      - iot_industrial_net

  # ============================================================================
  # 3. FRONTEND DASHBOARD + REVERSE PROXY NGINX (Único punto de entrada público)
  # ============================================================================
  frontend_dashboard:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: iot_frontend_dashboard
    restart: unless-stopped
    depends_on:
      - plant_monitor_backend
      - operator_console_backend
      - action_dispatcher
    ports:
      - "80:80"
      - "3000:80"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    networks:
      - iot_industrial_net

networks:
  iot_industrial_net:
    driver: bridge

volumes:
  postgres_data:
